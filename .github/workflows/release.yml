name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # electron-builder's createKeychain() makes a temp keychain with a random
      # password, then runs `security set-key-partition-list -k` with the p12
      # password instead (app-builder-lib macCodeSign.js). macOS runner image
      # 20260828 (Darwin 25.6) enforces -k, so signing dies with
      # "SecKeychainUnlock: The user name or passphrase you entered is not correct".
      # Import the cert ourselves and hand electron-builder CSC_KEYCHAIN instead of
      # CSC_LINK, which skips that code path entirely.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CSC_LINK }}
          p12-password: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          keychain: signing_temp
      # electron-builder silently ad-hoc signs when it can't see an identity, which
      # only surfaces minutes later as a notarization rejection. Fail here instead.
      - name: Verify macOS signing identity is visible
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! security find-identity -v -p codesigning signing_temp.keychain | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in signing_temp.keychain"
            security find-identity -v signing_temp.keychain
            exit 1
          fi
      # Windows is signed with Azure Artifact Signing (win.azureSignOptions in
      # electron-builder.yml). Without these electron-builder can't authenticate,
      # so fail before the slow build instead of after it.
      - name: Check the Windows signing secrets are set
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set."; exit 1; }
          done
      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization, from the keychain imported above (mac runner only)
          # .keychain suffix required: `security find-identity` won't resolve a bare name.
          CSC_KEYCHAIN: ${{ runner.os == 'macOS' && 'signing_temp.keychain' || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing with Azure Artifact Signing (Windows runner only)
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
      # The release stays a draft if this fails, since publish needs every build.
      - name: Verify the Windows installer is signed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter *.exe | Where-Object { $_.Name -like '*-Setup.exe' }
          if (-not $files) { Write-Error "No installer found in dist/"; exit 1 }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) is not validly signed"; exit 1 }
          }

  # electron-builder uploads assets to a DRAFT release; publish it once all three
  # platforms have finished so every installer is present before it goes public.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --draft=false --latest
