<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- app-icon rounded square -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- 2x2 device-tile dashboard -->
  <rect x="124" y="124" width="116" height="116" rx="24" fill="#0d1117"/>
  <rect x="272" y="124" width="116" height="116" rx="24" fill="#0d1117"/>
  <rect x="124" y="272" width="116" height="116" rx="24" fill="#0d1117"/>
  <rect x="272" y="272" width="116" height="116" rx="24" fill="#0d1117" opacity="0.55"/>
  <!-- active-device indicator -->
  <circle cx="160" cy="160" r="20" fill="#5eead4"/>
</svg>
